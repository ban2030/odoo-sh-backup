name: Test Odoo.sh SSH

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        env:
          ODOO_SSH_PRIVATE_KEY_B64: ${{ secrets.ODOO_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$ODOO_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/odoo_backup
          chmod 600 ~/.ssh/odoo_backup

          ssh-keyscan -H ban2030.odoo.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test Odoo.sh SSH
        run: |
          timeout 20s ssh \
            -i ~/.ssh/odoo_backup \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            30422060@ban2030.odoo.com \
            'echo ODOO_SH_SSH_OK'
